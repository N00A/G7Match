name: CI/CD Pipeline

on:
  push:
    branches: [ develop, main ]
  pull_request:
    branches: [ develop ]
    types: [opened, synchronize, reopened]
  workflow_dispatch:

jobs:
  build-and-analyze:
    name: CI (build • test • sonar) en develop/PR
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/develop' || github.event_name == 'pull_request'
    concurrency:
      group: rdg7-ci-${{ github.ref }}
      cancel-in-progress: true
    defaults:
      run:
        working-directory: rdg7/rdg7

    steps:
      - uses: actions/checkout@v5
        with: { fetch-depth: 0 }

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: 17
          distribution: zulu

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*','**/gradle-wrapper.properties') }}
          restore-keys: ${{ runner.os }}-gradle-

      - name: Cache SonarQube packages
        uses: actions/cache@v4
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Run tests and build (JAR)
        env:
          DB_URL: ${{ secrets.DB_URL }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
        run: ./gradlew clean build --info --no-daemon

      - name: SonarQube analysis (SonarCloud)
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io
        run: ./gradlew sonar --info --no-daemon

      - name: Check Sonar Quality Gate (SonarCloud)
        uses: sonarsource/sonarqube-quality-gate-action@v1.1.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io
        with:
          scanMetadataReportFile: build/sonar/report-task.txt

      - name: Upload JAR → EC2 (as ~/rdg7-0.0.1-SNAPSHOT.jar)
        if: github.ref == 'refs/heads/develop' && github.event_name == 'push'
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.AWS_HOST }}
          username: ${{ secrets.AWS_SSH_USER }}
          key: ${{ secrets.AWS_SSH_KEY }}
          source: "rdg7/rdg7/build/libs/rdg7-0.0.1-SNAPSHOT.jar"
          target: "~/"
          overwrite: true

      - name: Rename to app.jar in HOME (robusto)
        if: github.ref == 'refs/heads/develop' && github.event_name == 'push'
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.AWS_HOST }}
          username: ${{ secrets.AWS_SSH_USER }}
          key: ${{ secrets.AWS_SSH_KEY }}
          script: |
            cd ~
            if [ -f rdg7-0.0.1-SNAPSHOT.jar ]; then
              mv -f rdg7-0.0.1-SNAPSHOT.jar app.jar
              ls -l app.jar
            else
              echo "No se encontró rdg7-0.0.1-SNAPSHOT.jar en HOME"; exit 1
            fi

  deploy:
    name: CD (main) – ejecutar ~/deploy.sh en EC2
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    concurrency:
      group: rdg7-cd-main
      cancel-in-progress: true
    steps:
      - name: Run deploy.sh remotely
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.AWS_HOST }}
          username: ${{ secrets.AWS_SSH_USER }}
          key: ${{ secrets.AWS_SSH_KEY }}
          script: |
            cd ~
            chmod +x deploy.sh || true
            ./deploy.sh
